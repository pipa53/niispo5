# Service приложения: доступ только изнутри кластера.
# Шлюз обращается сюда по имени api:8000.
apiVersion: v1
kind: Service
metadata:
  name: api # DNS-имя приложения
spec:
  type: ClusterIP # тип: только внутренний трафик
  selector:
    app: warden # отбор обслуживаемых подов
    tier: api
  ports:
    - name: http # условное имя порта
      port: 8000 # порт сервиса
      targetPort: 8000 # порт контейнера FastAPI
