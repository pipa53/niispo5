# ConfigMap с настройками nginx (тот же app.conf, что в ЛР1).
# Файл попадает в под без пересборки образа.
apiVersion: v1
kind: ConfigMap # несекретные настройки открытым текстом
metadata:
  name: gateway-conf # имя, на которое ссылается Deployment
data:
  # Ключ становится именем файла default.conf в точке монтирования.
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        location / {
            # DNS-имя Service приложения в кластере.
            proxy_pass http://api:8000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
