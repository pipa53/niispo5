# Service базы данных: доступ только изнутри кластера.
# Приложение обращается к базе по DNS-имени postgres:5432.
apiVersion: v1
kind: Service # стабильная точка входа к набору подов
metadata:
  name: postgres # DNS-имя в пределах кластера
spec:
  type: ClusterIP # тип: только внутренний трафик
  selector:
    app: warden # отбор обслуживаемых подов
    tier: postgres
  ports:
    - name: postgres # условное имя порта
      port: 5432 # порт сервиса
      targetPort: 5432 # порт контейнера в поде
