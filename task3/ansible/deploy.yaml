# Playbook Task 3: разворачивание приложения из ЛР1 в kind-кластер.
# Порядок принципиален: БД -> миграции -> приложение -> шлюз.
# Запуск: ansible-playbook -i inventory.ini deploy.yaml
---
- name: Deploy warden application to kind cluster
  hosts: cluster
  tasks:
    # 1. База данных: StatefulSet и Service. Ждём готовности пода.
    - name: Apply database manifests
      ansible.builtin.command:
        cmd: kubectl apply -f {{ k8s_dir }}/db-statefulset.yaml -f {{ k8s_dir }}/db-service.yaml
      changed_when: true

    - name: Wait for database pod
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=ready pod -l tier=postgres --timeout=180s
      changed_when: false

    # 2. Миграции Liquibase в виде Job. Ждём завершения задачи.
    - name: Apply migration job
      ansible.builtin.command:
        cmd: kubectl apply -f {{ k8s_dir }}/liquibase-job.yaml
      changed_when: true

    - name: Wait for migration completion
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=complete job/migrator --timeout=180s
      changed_when: false

    # 3. Приложение и шлюз: Deployment, Service, ConfigMap.
    - name: Apply application and gateway manifests
      ansible.builtin.command:
        cmd: kubectl apply -f {{ k8s_dir }}/app-deployment.yaml -f {{ k8s_dir }}/app-service.yaml -f {{ k8s_dir }}/web-configmap.yaml -f {{ k8s_dir }}/web-deployment.yaml -f {{ k8s_dir }}/web-service.yaml
      changed_when: true

    - name: Wait for application rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/api --timeout=180s
      changed_when: false

    - name: Wait for gateway rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/gateway --timeout=180s
      changed_when: false

    # 4. Размещение: api и gateway на k8s-lab-worker,
    #    база данных — на k8s-lab-worker2.
    - name: Show pod placement across nodes
      ansible.builtin.command:
        cmd: kubectl get pods -o wide
      changed_when: false
      register: pods_wide

    - name: Print placement
      ansible.builtin.debug:
        var: pods_wide.stdout_lines
