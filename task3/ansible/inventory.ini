# Опись узлов для Task 3: работаем с локальным хостом,
# у которого kubectl уже настроен на контекст kind-кластера,
# созданного через Terraform.
[cluster]
localhost ansible_connection=local ansible_become=false

[cluster:vars]
ansible_python_interpreter=/usr/bin/python3
# Каталог с манифестами внутри WSL (копируется туда перед запуском).
k8s_dir=/root/k8s-lab/k8s
