# Опись узлов для Ansible (по статье How To Set Up Ansible Inventories).
# Отдельных виртуальных машин из ЛР4 здесь нет — вместо них
# используется локальная машина WSL-Ubuntu с подключением
# через connection=local, то есть без SSH.

# Группа nodes: единственный узел — локальный хост.
[nodes]
localhost ansible_connection=local ansible_become=true

# Переменные уровня группы: путь к интерпретатору Python для модулей.
[nodes:vars]
ansible_python_interpreter=/usr/bin/python3
